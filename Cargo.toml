[package]
name = "paddock"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A request-queueing reverse proxy for Ollama that smooths out bursts of concurrent LLM requests"
license = "MIT"

[lib]
name = "paddock"
path = "src/lib.rs"

[[bin]]
name = "paddock"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
